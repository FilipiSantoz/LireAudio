[package]
name = "lire_audio"
version = "0.1.0"
description = "Spectrum Analyzer"
edition = "2024"

[dependencies]
cpal = { version = "0.18.2" }
ringbuf = { version = "0.5.2" }
rustfft = { version = "6.4.1" }
eframe = { version = "0.36.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-opener = "2.7.1"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", features = ["v0_3_44", "v0_3_49"]}
libspa = "0.10.1"

[workspace]
members = ["src-tauri"]
