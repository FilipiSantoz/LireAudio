[package]
name = "lire_audio"
version = "0.1.0"
description = "Lire Audio"
authors = ["FilipiSantoz"]
license = "MIT"
repository = "https://github.com/FilipiSantoz/LireAudio"
edition = "2024"
rust-version = "1.99.0"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
ringbuf = { version = "0.5.2" }
rustfft = { version = "6.4.1" }
eframe = { version = "0.36.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", features = ["v0_3_44", "v0_3_49"]}
libspa = "0.10.1"

[[bin]]
name = "gui"
required-features = ["gui"]

[workspace]
members = ["src-tauri"]
